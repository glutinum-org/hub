# Run this workflow when the "test" workflow completes successfully on the main branch.
on:
  workflow_run:
    workflows: ["test"]
    types:
      - completed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  id-token: write

name: EasyBuild ShipIt

# Learn more at https://github.com/easybuild-org/EasyBuild.ShipIt#github-actions-auto-release

jobs:
  # Generate a Pull Request to prepare a release, one version per binding (each has its own CHANGELOG.md)
  shipit-pr:
    name: ShipIt - Pull Request
    runs-on: ubuntu-latest
    if: "github.event.workflow_run.conclusion == 'success'"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 300
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: ShipIt (Pull Request)
        run: |
          dotnet tool restore
          dotnet shipit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Release the bindings when the PR is merged (or if you create a 'chore: release ...' commit directly on main).
  release:
    name: Release
    runs-on: ubuntu-latest
    if: "github.event.workflow_run.conclusion == 'success' && startsWith(github.event.workflow_run.head_commit.message, 'chore: release ')"
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6

      # Trusted publishing: NuGet hands out a short-lived key in exchange for this run's OIDC
      # token, so the repository holds no API key. Register this repository as a trusted
      # publisher on nuget.org for the account below.
      #
      # Learn more at https://github.com/NuGet/login
      - name: NuGet login (OIDC to temporary API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: MangelMaxime

      # Packs every binding and pushes the versions nuget.org doesn't have yet
      - name: Release
        run: ./build.sh release
        env:
          NUGET_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
