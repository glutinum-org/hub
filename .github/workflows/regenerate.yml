# Regenerate every binding with a new Glutinum release, in a pull request.
#
# The release workflow of glutinum-org/cli sends the `glutinum-release` event with the version published.
name: regenerate

on:
  repository_dispatch:
    types: [glutinum-release]
  workflow_dispatch:
    inputs:
      glutinum-version:
        description: The version of @glutinum/cli to regenerate with, the pinned one when empty
        required: false
        type: string
  # Weekly regeneration with the pinned version, disabled for now
  # schedule:
  #   # Monday 6:00 UTC
  #   - cron: "0 6 * * 1"

permissions:
  contents: write
  pull-requests: write

jobs:
  regenerate:
    name: Regenerate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
      - uses: pnpm/action-setup@v6

      - name: Pin the Glutinum release
        if: github.event.client_payload.version != '' || inputs.glutinum-version != ''
        run: pnpm add --save-dev --workspace-root --save-exact @glutinum/cli@${{ github.event.client_payload.version || inputs.glutinum-version }}

      - run: pnpm install && npx playwright install --with-deps chromium
      - run: ./build.sh generate
      - run: ./build.sh test

      # Each binding folder touched gets a release entry from this one commit
      - name: Open a pull request
        uses: peter-evans/create-pull-request@v7
        with:
          branch: regenerate
          title: "feat: regenerate the bindings with Glutinum ${{ github.event.client_payload.version || inputs.glutinum-version || 'of package.json' }}"
          commit-message: "feat: regenerate the bindings with Glutinum ${{ github.event.client_payload.version || inputs.glutinum-version || 'of package.json' }}"
          body: |
            Regenerated by the `regenerate` workflow. Review the diff of each binding, the tests passed.
